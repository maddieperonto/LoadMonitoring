<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roster — UF S&C</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --uf-orange: #FA4616;
            --uf-blue:   #003087;
            --uf-navy:   #001F5B;
            --bg:        #F5F5F5;
            --surface:   #FFFFFF;
            --text:      #1A1A1A;
            --muted:     #6B7280;
            --border:    #E5E7EB;
            --red:       #DC2626;
            --amber:     #D97706;
            --green:     #16A34A;
            --red-bg:    #FEF2F2;
            --amber-bg:  #FFFBEB;
            --green-bg:  #F0FDF4;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        .page-wrap { max-width: 1400px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 1.75rem; flex-wrap: wrap; gap: 0.75rem;
        }
        .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 700; color: var(--uf-navy); }

        .section-label {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 0.75rem;
        }

        /* ── Filters bar ────────────────────────────────────────────────── */
        .filters-bar {
            display: flex; align-items: center; gap: 0.75rem;
            flex-wrap: wrap; margin-bottom: 1.25rem;
            background: var(--surface); border-radius: 10px;
            border: 1px solid var(--border); padding: 0.85rem 1.1rem;
        }
        .filter-label { font-size: 0.78rem; font-weight: 600; color: var(--muted); }
        select {
            font-family: 'Inter', sans-serif; font-size: 0.82rem;
            border: 1px solid var(--border); border-radius: 6px;
            padding: 0.38rem 0.65rem; color: var(--text);
            background: var(--surface); cursor: pointer;
        }
        .search-input {
            font-family: 'Inter', sans-serif; font-size: 0.85rem;
            border: 1px solid var(--border); border-radius: 6px;
            padding: 0.38rem 0.75rem; color: var(--text);
            background: var(--surface); outline: none; min-width: 200px;
        }
        .search-input:focus { border-color: var(--uf-blue); box-shadow: 0 0 0 2px rgba(0,48,135,0.1); }
        .roster-count { font-size: 0.78rem; color: var(--muted); margin-left: auto; }

        /* ── Roster table ───────────────────────────────────────────────── */
        .card { background: var(--surface); border-radius: 10px; border: 1px solid var(--border); padding: 1.25rem; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        thead th {
            background: #F9FAFB; padding: 0.65rem 1rem; text-align: left;

        thead th:hover { background: #F3F4F6; }
        thead th.sorted-asc::after  { content: ' ↑'; }
        thead th.sorted-desc::after { content: ' ↓'; }

            border-bottom: 1px solid #F3F4F6; cursor: pointer;

        .jersey-num {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.1rem; font-weight: 700; color: var(--uf-navy);
        }

        .status-badge {
            display: inline-flex; align-items: center; padding: 0.2rem 0.65rem;
            border-radius: 999px; font-size: 0.72rem; font-weight: 700; white-space: nowrap;
        }
        .status-active  { background: var(--green-bg); color: var(--green); }
        .status-injured { background: var(--red-bg);   color: var(--red);   }
        .status-limited { background: var(--amber-bg); color: var(--amber); }
        .status-out     { background: #F3F4F6;          color: var(--muted); }

        /* ── Summary stat cards ─────────────────────────────────────────── */
        .stat-strip {
            display: grid; grid-template-columns: repeat(5, 1fr);
            gap: 0.75rem; margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--surface); border-radius: 10px;
            border: 1px solid var(--border); padding: 1rem 1.1rem;

        .stat-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }

        .stat-sub   { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }

        /* ── Modal ──────────────────────────────────────────────────────── */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.52); z-index: 2000;
            align-items: center; justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface); border-radius: 14px;
            width: 100%; max-width: 820px; max-height: 90vh;
            overflow-y: auto; position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .modal-top {
            background: var(--uf-navy); border-radius: 14px 14px 0 0;
            padding: 1.5rem 1.75rem 1.25rem; position: relative;
        }
        .modal-close {
            position: absolute; top: 1rem; right: 1rem;
            background: rgba(255,255,255,0.12); border: none;
            border-radius: 6px; color: rgba(255,255,255,0.8);
            font-size: 1rem; width: 28px; height: 28px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .modal-jersey {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem; font-weight: 600; color: var(--uf-orange);
            letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.15rem;
        }
        .modal-name {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 2rem; font-weight: 700; color: #fff; line-height: 1.1; margin-bottom: 0.4rem;
        }
        .modal-meta { font-size: 0.82rem; color: rgba(255,255,255,0.6); }
        .modal-meta span { color: rgba(255,255,255,0.85); }

        .modal-body { padding: 1.5rem 1.75rem; }

        /* Risk score row */
        .modal-risk-row {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem; margin-bottom: 1.5rem;
        }
        .modal-stat {
            background: #F9FAFB; border-radius: 8px; padding: 0.85rem 1rem;
        }
        .modal-stat-label {
            font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em;
            text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem;
        }
        .modal-stat-value {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.6rem; font-weight: 700; color: var(--uf-navy); line-height: 1;
        }

        /* Chart tabs */
        .chart-tabs { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 2px solid var(--border); }
        .chart-tab {
            font-size: 0.82rem; font-weight: 600; padding: 0.5rem 1rem;
            color: var(--muted); background: none; border: none; cursor: pointer;
            border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.15s;
        }
        .chart-tab:hover  { color: var(--uf-navy); }
        .chart-tab.active { color: var(--uf-orange); border-bottom-color: var(--uf-orange); }

        .chart-panel { display: none; }
        .chart-panel.active { display: block; }
        .modal-chart-wrap { position: relative; height: 220px; }

        /* Flag history */
        .flag-history { display: flex; flex-direction: column; gap: 0; margin-top: 1.25rem; }
        .flag-item {
            display: flex; align-items: flex-start; gap: 0.85rem;
            padding: 0.7rem 0; border-bottom: 1px solid #F3F4F6;
            font-size: 0.82rem;
        }
        .flag-item:last-child { border-bottom: none; }
        .flag-pill {
            font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.55rem;
            border-radius: 999px; white-space: nowrap; flex-shrink: 0;
        }
        .pill-high     { background: var(--red-bg);   color: var(--red);   }
        .pill-moderate { background: var(--amber-bg); color: var(--amber); }
        .pill-resolved { background: #F3F4F6; color: var(--muted); }

        @media (max-width: 900px) {
            .stat-strip { grid-template-columns: repeat(3,1fr); }
            .modal-risk-row { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 600px) {
            .stat-strip { grid-template-columns: 1fr 1fr; }
            .modal-risk-row { grid-template-columns: 1fr 1fr; }
            .modal-body { padding: 1rem; }
            .modal-top  { padding: 1.25rem 1rem 1rem; }
        }
    </style>
</head>
<body>

<!-- ── Athlete Modal ───────────────────────────────────────────────────── -->
<div class="modal-overlay" id="athlete-modal">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
import { initAuth, showSpinner, hideSpinner, showError } from 'https://cdn.jsdelivr.net/gh/maddieperonto/LoadMonitoring@main/scripts/auth.js';
const supabase = createClient('https://fyhgvxfrwbwuqxllodip.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5aGd2eGZyd2J3dXF4bGxvZGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzk5ODIsImV4cCI6MjA5NDcxNTk4Mn0.665OZwCsBvnHCVZ-ApiF2xM1CBgTIYZe2EEbuW7IW3U');

await initAuth('roster');

// ─────────────────────────────────────────────────────────────────────────
// FETCH
// ─────────────────────────────────────────────────────────────────────────
const [
    { data: athletes,  error: errA },
    { data: cmjTests,  error: errC },
    { data: nordbord,  error: errN },
    { data: sessions,  error: errS },
    { data: flags,     error: errF },
] = await Promise.all([
    supabase.from('athletes').select('*').order('jersey_number', { ascending: true }),
    supabase.from('cmj_tests').select('*').order('test_date', { ascending: true }),
    supabase.from('nordbord_tests').select('*').order('test_date', { ascending: true }),
    supabase.from('gps_sessions').select('athlete_id, session_date, player_load').order('session_date', { ascending: false }),
    supabase.from('flags').select('*').order('flag_date', { ascending: false }),
]);

if (errA || errC || errN || errS || errF) {
    document.querySelector('.page-wrap').innerHTML =
        `<div style="padding:2rem;color:#991b1b;background:#fef2f2;border-radius:8px;">
            ⚠️ Failed to load data: ${(errA||errC||errN||errS||errF)?.message}
         </div>`;
    throw new Error('Fetch failed');
}

// ─────────────────────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────────────────────
function fmtHt(inches) {
    return `${Math.floor(inches/12)}'${inches%12}"`;
}

function statusClass(s) {
    return s==='Active'?'status-active':s==='Injured'?'status-injured':s==='Limited'?'status-limited':'status-out';
}

function computeACWR(rows) {
    if (!rows || rows.length < 7) return null;
    const sorted  = [...rows].sort((a,b)=>new Date(b.session_date)-new Date(a.session_date));
    const acute   = sorted.slice(0,7).reduce((s,r)=>s+Number(r.player_load),0);
    const weeks   = [0,1,2,3].map(w=>sorted.slice(w*7,w*7+7).reduce((s,r)=>s+Number(r.player_load),0));
    const chronic = weeks.reduce((s,w)=>s+w,0)/4;
    return chronic > 0 ? acute/chronic : null;
}

function computeCMJPct(tests) {
    if (!tests || tests.length < 2) return null;
    const sorted   = [...tests].sort((a,b)=>new Date(b.test_date)-new Date(a.test_date));
    const current  = Number(sorted[0].jump_height_cm);
    const baseline = sorted.slice(1,5).reduce((s,t)=>s+Number(t.jump_height_cm),0)/Math.min(sorted.length-1,4);
    return ((current-baseline)/baseline)*100;
}

function computeRisk(acwr, cmjPct, lsi, mono, days) {
    let score = 0;
    if (acwr !== null) {
        if (acwr > 1.5) score += Math.min(25,((acwr-1.5)/0.5)*25);
        else if (acwr < 0.8) score += Math.min(25,((0.8-acwr)/0.4)*25);
    }
    if (cmjPct !== null && cmjPct < -10) score += Math.min(25,((-cmjPct-10)/10)*25);
    if (lsi !== null && lsi < 95)        score += Math.min(20,((95-lsi)/5)*20);
    if (mono !== null && mono > 1.5)     score += Math.min(15,((mono-1.5)/0.5)*15);
    if (days !== null && days > 3)       score += Math.min(15,((days-3)/4)*15);
    return Math.min(100, Math.round(score));
}

// ─────────────────────────────────────────────────────────────────────────
// SUMMARY STRIP
// ─────────────────────────────────────────────────────────────────────────
document.getElementById('s-total').textContent   = athletes.length;
document.getElementById('s-active').textContent  = athletes.filter(a=>a.status==='Active').length;
document.getElementById('s-limited').textContent = athletes.filter(a=>a.status==='Limited').length;
document.getElementById('s-injured').textContent = athletes.filter(a=>a.status==='Injured').length;
document.getElementById('s-out').textContent     = athletes.filter(a=>a.status==='Out').length;

// ─────────────────────────────────────────────────────────────────────────
// ROSTER TABLE
// ─────────────────────────────────────────────────────────────────────────
let sortState = { col: 'jersey', dir: 'asc' };
let posFilter    = 'all';
let yearFilter   = 'all';
let statusFilter = 'all';
let searchQuery  = '';

function getFiltered() {
    return athletes.filter(a => {
        if (posFilter    !== 'all' && a.position   !== posFilter)    return false;
        if (yearFilter   !== 'all' && a.class_year !== yearFilter)   return false;
        if (statusFilter !== 'all' && a.status     !== statusFilter) return false;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            if (!a.name.toLowerCase().includes(q) && !String(a.jersey_number).includes(q)) return false;
        }
        return true;
    });
}

function renderRosterTable() {
    let rows = getFiltered();

    rows.sort((a, b) => {
        let va, vb;
        switch (sortState.col) {
            case 'jersey': va = a.jersey_number;  vb = b.jersey_number; break;
            case 'name':   return sortState.dir==='asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
            case 'pos':    return sortState.dir==='asc' ? a.position.localeCompare(b.position) : b.position.localeCompare(a.position);
            case 'year':   va = ['FR','SO','JR','SR','GR'].indexOf(a.class_year);
                           vb = ['FR','SO','JR','SR','GR'].indexOf(b.class_year); break;
            case 'ht':     va = a.height_in;  vb = b.height_in; break;
            case 'wt':     va = a.weight_lbs; vb = b.weight_lbs; break;
            default:       va = 0; vb = 0;
        }
        return sortState.dir === 'asc' ? va - vb : vb - va;
    });

    document.getElementById('roster-count').textContent = `${rows.length} of ${athletes.length} athletes`;

    const mkTh = (col, label, extra='') =>
        `<th data-col="${col}" class="${sortState.col===col?'sorted-'+sortState.dir:''}" ${extra}>${label}</th>`;

    document.getElementById('roster-table-wrap').innerHTML = `
        <table>
            <thead>
                <tr>
                    ${mkTh('jersey','#','style="width:48px"')}
                    ${mkTh('name','Name')}
                    ${mkTh('pos','Position')}
                    ${mkTh('year','Year')}
                    ${mkTh('ht','Height')}
                    ${mkTh('wt','Weight')}
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                ${rows.map(a => `
                    <tr data-id="${a.id}">
                        <td><span class="jersey-num">${a.jersey_number}</span></td>
                        <td style="font-weight:600">${a.name}</td>
                        <td>${a.position}</td>
                        <td style="color:var(--muted)">${a.class_year}</td>
                        <td style="color:var(--muted)">${fmtHt(a.height_in)}</td>
                        <td style="color:var(--muted)">${a.weight_lbs} lbs</td>
                        <td><span class="status-badge ${statusClass(a.status)}">${a.status}</span></td>
                    </tr>`).join('')}
            </tbody>
        </table>`;

    // Sort on header click
    document.querySelectorAll('#roster-table-wrap thead th[data-col]').forEach(th => {
        th.addEventListener('click', () => {
            const col = th.dataset.col;
            if (sortState.col === col) sortState.dir = sortState.dir==='asc'?'desc':'asc';
            else { sortState.col = col; sortState.dir = 'asc'; }
            renderRosterTable();
        });
    });

    // Row click → modal
    document.querySelectorAll('#roster-table-wrap tbody tr').forEach(row => {
        row.addEventListener('click', () => openModal(row.dataset.id));
    });
}

renderRosterTable();

document.getElementById('pos-filter').addEventListener('change',    function(){ posFilter    = this.value; renderRosterTable(); });
document.getElementById('year-filter').addEventListener('change',   function(){ yearFilter   = this.value; renderRosterTable(); });
document.getElementById('status-filter').addEventListener('change', function(){ statusFilter = this.value; renderRosterTable(); });
document.getElementById('search-input').addEventListener('input',   function(){ searchQuery  = this.value.trim(); renderRosterTable(); });

// ─────────────────────────────────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────────────────────────────────
let modalCMJChart  = null;
let modalLSIChart  = null;
let modalACWRChart = null;

function destroyModalCharts() {
    [modalCMJChart, modalLSIChart, modalACWRChart].forEach(c => { if (c) c.destroy(); });
    modalCMJChart = modalLSIChart = modalACWRChart = null;
}

async function openModal(athleteId) {
    const ath      = athletes.find(a => a.id === athleteId);
    if (!ath) return;

    const athCMJ   = cmjTests.filter(t=>t.athlete_id===athleteId).sort((a,b)=>new Date(a.test_date)-new Date(b.test_date));
    const athNB    = nordbord.filter(t=>t.athlete_id===athleteId).sort((a,b)=>new Date(a.test_date)-new Date(b.test_date));
    const athGPS   = sessions.filter(r=>r.athlete_id===athleteId).sort((a,b)=>new Date(b.session_date)-new Date(a.session_date));
    const athFlags = flags.filter(f=>f.athlete_id===athleteId);

    // Computed metrics
    const acwr    = computeACWR(athGPS);
    const cmjPct  = computeCMJPct(athCMJ);
    const latestNB= athNB[athNB.length-1];
    const lsi     = latestNB ? Number(latestNB.lsi_pct) : null;
    const mono    = (() => {
        const last7 = athGPS.slice(0,7).map(r=>Number(r.player_load));
        if (last7.length < 3) return null;
        const mean = last7.reduce((s,v)=>s+v,0)/last7.length;
        const sd   = Math.sqrt(last7.reduce((s,v)=>s+(v-mean)**2,0)/last7.length);
        return sd > 0 ? mean/sd : null;
    })();
    const days    = (() => { let d=0; for (const r of athGPS) { if (Number(r.player_load)>100) d++; else break; } return d; })();
    const risk    = computeRisk(acwr, cmjPct, lsi, mono, days);
    const riskCol = risk>=61?'var(--red)':risk>=31?'var(--amber)':'var(--green)';
    const riskLbl = risk>=61?'HIGH':risk>=31?'MODERATE':'LOW';

    // ── Populate header ──────────────────────────────────────────────────
    document.getElementById('modal-jersey').textContent = `#${ath.jersey_number} · ${ath.position} · ${ath.class_year}`;
    document.getElementById('modal-name').textContent   = ath.name;
    document.getElementById('modal-meta').innerHTML =
        `<span>${fmtHt(ath.height_in)}</span> &nbsp;·&nbsp; <span>${ath.weight_lbs} lbs</span> &nbsp;·&nbsp;
         <span style="color:${ath.status==='Active'?'#6ee7b7':ath.status==='Injured'?'#fca5a5':'#fde68a'};font-weight:600">${ath.status}</span>`;

    // ── Key stats ────────────────────────────────────────────────────────
    document.getElementById('modal-stats').innerHTML = `
        <div class="modal-stat">
            <div class="modal-stat-label">Composite Risk</div>
            <div class="modal-stat-value" style="color:${riskCol}">${risk}/100</div>
            <div style="font-size:0.72rem;color:var(--muted)">${riskLbl}</div>
        </div>
        <div class="modal-stat">
            <div class="modal-stat-label">ACWR</div>
            <div class="modal-stat-value" style="color:${acwr&&(acwr>1.5||acwr<0.8)?'var(--red)':'var(--uf-navy)'}">
                ${acwr?acwr.toFixed(2):'—'}
            </div>
            <div style="font-size:0.72rem;color:var(--muted)">Safe: 0.8–1.5</div>
        </div>
        <div class="modal-stat">
            <div class="modal-stat-label">CMJ Δ</div>
            <div class="modal-stat-value" style="color:${cmjPct===null?'var(--uf-navy)':cmjPct<-20?'var(--red)':cmjPct<-10?'var(--amber)':'var(--green)'}">
                ${cmjPct!==null?(cmjPct>0?'+':'')+cmjPct.toFixed(1)+'%':'—'}
            </div>
            <div style="font-size:0.72rem;color:var(--muted)">vs baseline</div>
        </div>
        <div class="modal-stat">
            <div class="modal-stat-label">NordBord LSI</div>
            <div class="modal-stat-value" style="color:${lsi===null?'var(--uf-navy)':lsi<90?'var(--red)':lsi<95?'var(--amber)':'var(--green)'}">
                ${lsi!==null?lsi.toFixed(1)+'%':'—'}
            </div>
            <div style="font-size:0.72rem;color:var(--muted)">Target ≥ 95%</div>
        </div>`;

    // ── Destroy old charts, open modal ───────────────────────────────────
    destroyModalCharts();
    document.getElementById('athlete-modal').classList.add('open');

    // Reset to CMJ tab
    document.querySelectorAll('.chart-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.chart-panel').forEach(p=>p.classList.remove('active'));
    document.querySelector('[data-tab="cmj"]').classList.add('active');
    document.getElementById('panel-cmj').classList.add('active');

    // ── CMJ chart ────────────────────────────────────────────────────────
    if (athCMJ.length > 0) {
        modalCMJChart = new Chart(document.getElementById('modal-cmj-chart').getContext('2d'), {
            type: 'line',
            data:{
                labels: athCMJ.map(t=>t.test_date),
                datasets:[{
                    label:'Jump Height (cm)',
                    data: athCMJ.map(t=>Number(t.jump_height_cm).toFixed(2)),
                    borderColor:'#FA4616', backgroundColor:'rgba(250,70,22,0.1)',
                    borderWidth:2.5, pointRadius:5, tension:0.3,
                }]
            },
            options:{
                responsive:true, maintainAspectRatio:false,
                plugins:{ legend:{display:false}, tooltip:{mode:'index',intersect:false} },
                scales:{
                    y:{ title:{display:true,text:'Jump Height (cm)',font:{size:10}}, ticks:{font:{size:10}} },
                    x:{ ticks:{font:{size:10}} }
                }
            }
        });
    } else {
        document.getElementById('modal-cmj-chart').parentElement.innerHTML =
            '<div style="padding:2rem;text-align:center;color:var(--muted)">No CMJ data available</div>';
    }

    // ── LSI chart ────────────────────────────────────────────────────────
    if (athNB.length > 0) {
        modalLSIChart = new Chart(document.getElementById('modal-lsi-chart').getContext('2d'), {
            type: 'line',
            data:{
                labels: athNB.map(t=>t.test_date),
                datasets:[
                    {
                        label:'LSI (%)',
                        data: athNB.map(t=>Number(t.lsi_pct).toFixed(1)),
                        borderColor:'#003087', backgroundColor:'rgba(0,48,135,0.1)',
                        borderWidth:2.5, pointRadius:5, tension:0.3,
                    },
                    {
                        label:'RTP Threshold (90%)',
                        data: Array(athNB.length).fill(90),
                        borderColor:'#DC2626', borderDash:[5,3], borderWidth:1.5, pointRadius:0,
                    },
                ]
            },
            options:{
                responsive:true, maintainAspectRatio:false,
                plugins:{ legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}}, tooltip:{mode:'index',intersect:false} },
                scales:{
                    y:{ min:50, max:105, title:{display:true,text:'LSI (%)',font:{size:10}}, ticks:{font:{size:10}} },
                    x:{ ticks:{font:{size:10}} }
                }
            }
        });
    } else {
        document.getElementById('modal-lsi-chart').parentElement.innerHTML =
            '<div style="padding:2rem;text-align:center;color:var(--muted)">No NordBord data available</div>';
    }

    // ── ACWR chart — rolling 28 days ─────────────────────────────────────
    const sortedGPS = [...athGPS].sort((a,b)=>new Date(a.session_date)-new Date(b.session_date));
    if (sortedGPS.length >= 7) {
        const acwrPoints = sortedGPS.map((row, i) => {
            const window = sortedGPS.slice(Math.max(0,i-27), i+1);
            return computeACWR(window);
        }).filter(v=>v!==null);
        const acwrLabels = sortedGPS
            .slice(sortedGPS.length - acwrPoints.length)
            .map(r=>r.session_date);

        modalACWRChart = new Chart(document.getElementById('modal-acwr-chart').getContext('2d'), {
            type: 'line',
            data:{
                labels: acwrLabels,
                datasets:[
                    {
                        label:'ACWR',
                        data: acwrPoints.map(v=>v.toFixed(2)),
                        borderColor:'#FA4616', backgroundColor:'rgba(250,70,22,0.1)',
                        borderWidth:2, pointRadius:1.5, tension:0.35, fill:true,
                    },
                    {
                        label:'Upper (1.5)',
                        data: Array(acwrLabels.length).fill(1.5),
                        borderColor:'#DC2626', borderDash:[5,3], borderWidth:1.5, pointRadius:0,
                    },
                    {
                        label:'Lower (0.8)',
                        data: Array(acwrLabels.length).fill(0.8),
                        borderColor:'#D97706', borderDash:[5,3], borderWidth:1.5, pointRadius:0,
                    },
                ]
            },
            options:{
                responsive:true, maintainAspectRatio:false,
                plugins:{ legend:{position:'bottom',labels:{boxWidth:12,font:{size:10}}}, tooltip:{mode:'index',intersect:false} },
                scales:{
                    y:{ min:0.3, max:2.2, title:{display:true,text:'ACWR',font:{size:10}}, ticks:{font:{size:10}} },
                    x:{ ticks:{maxTicksLimit:8,font:{size:9}} }
                }
            }
        });
    } else {
        document.getElementById('modal-acwr-chart').parentElement.innerHTML =
            '<div style="padding:2rem;text-align:center;color:var(--muted)">Insufficient GPS data for ACWR trend</div>';
    }

    // ── Flag history ─────────────────────────────────────────────────────
    document.getElementById('modal-flags').innerHTML = athFlags.length === 0
        ? '<div style="color:var(--green);font-size:0.82rem;font-weight:600;padding:0.5rem 0">✓ No flag history on record</div>'
        : athFlags.map(f => `
            <div class="flag-item">
                <span class="flag-pill ${f.resolved?'pill-resolved':f.severity==='HIGH'?'pill-high':'pill-moderate'}">
                    ${f.resolved?'RESOLVED':f.severity}
                </span>
                <div>
                    <div style="font-weight:600;font-size:0.82rem">${f.flag_type} <span style="color:var(--muted);font-weight:400;font-size:0.75rem">· ${f.flag_date}</span></div>
                    <div style="color:var(--muted);font-size:0.75rem;margin-top:0.1rem">${f.triggered_by}</div>
                    <div style="font-size:0.78rem;margin-top:0.2rem">${f.recommended_action}</div>
                </div>
            </div>`).join('');
}

// ── Tab switching ─────────────────────────────────────────────────────────
document.querySelectorAll('.chart-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.chart-tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.chart-panel').forEach(p=>p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
    });
});

// ── Close modal ───────────────────────────────────────────────────────────
document.getElementById('modal-close-btn').addEventListener('click', () => {
    document.getElementById('athlete-modal').classList.remove('open');
    destroyModalCharts();
});
document.getElementById('athlete-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) {
        e.currentTarget.classList.remove('open');
        destroyModalCharts();
    }
});
</script>

</body>
</html>

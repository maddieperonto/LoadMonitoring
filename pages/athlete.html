<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UF S&C — Athlete Portal</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --uf-orange:#FA4616;--uf-blue:#003087;
  --uf-orange-pale:#FFF0EC;--uf-blue-pale:#E8EEF8;
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F8F9FB;
  --sidebar-bg:#001F5B;--sidebar-text:#C8D6F0;--sidebar-text-dim:#7A95C4;
  --sidebar-border:rgba(255,255,255,0.08);
  --border:rgba(0,48,135,0.10);--border2:rgba(0,48,135,0.20);
  --text:#0F1923;--text2:#475569;--text3:#94A3B8;
  --acc:var(--uf-orange);--acc3:#16A34A;--acc4:#D97706;--acc5:#DC2626;
  --font-d:'Barlow Condensed',sans-serif;
  --font-b:'Barlow',sans-serif;--font-m:'DM Mono',monospace;
  --r:8px;--r2:12px;
  --shadow:0 1px 4px rgba(0,0,0,0.08),0 0 0 1px rgba(0,48,135,0.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-b);background:var(--bg);color:var(--text);font-size:13px;overflow:hidden}
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:220px;background:var(--sidebar-bg);display:flex;flex-direction:column;flex-shrink:0;box-shadow:2px 0 12px rgba(0,0,0,0.15)}
.sidebar-logo{padding:0;border-bottom:1px solid var(--sidebar-border);background:linear-gradient(160deg,rgba(250,70,22,0.18) 0%,transparent 60%)}
.sidebar-logo-top{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.sidebar-logo-gator{width:34px;height:34px;background:var(--uf-orange);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:18px;font-weight:900;color:#fff;flex-shrink:0}
.logo-text{font-family:var(--font-d);font-size:19px;font-weight:900;letter-spacing:1px;color:#fff;text-transform:uppercase;line-height:1}
.logo-sub{font-family:var(--font-m);font-size:9px;color:var(--sidebar-text-dim);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.sidebar-stripe{height:3px;background:linear-gradient(90deg,var(--uf-orange) 0%,#FF8C42 50%,var(--uf-orange) 100%)}
.sidebar-athlete{padding:16px;border-bottom:1px solid var(--sidebar-border)}
.sidebar-athlete-name{font-family:var(--font-d);font-size:15px;font-weight:700;color:#fff;letter-spacing:.3px}
.sidebar-athlete-pos{font-family:var(--font-m);font-size:9px;color:var(--sidebar-text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:3px}
.nav-user{padding:12px 16px;border-top:1px solid var(--sidebar-border);margin-top:auto}
.btn-logout-side{width:100%;padding:6px;font-family:var(--font-d);font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:rgba(255,255,255,0.07);color:var(--sidebar-text);border:1px solid var(--sidebar-border);border-radius:6px;cursor:pointer;transition:all .13s}
.btn-logout-side:hover{background:rgba(250,70,22,0.2);color:var(--uf-orange);border-color:rgba(250,70,22,0.3)}

/* Main */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,0.06)}
.topbar-left{display:flex;align-items:center;gap:14px}
.topbar-crest{width:28px;height:28px;background:var(--uf-blue);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--font-d);font-size:13px;font-weight:900;color:#fff}
.topbar-title{font-family:var(--font-d);font-size:26px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text)}
.content-area{flex:1;overflow-y:auto;padding:20px 22px;background:var(--bg)}

/* Panels */
.panel{background:var(--surface);border-radius:var(--r2);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.panel-title{font-family:var(--font-d);font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:7px;padding-bottom:10px;border-bottom:2px solid var(--bg)}
.panel-title i{font-size:15px;color:var(--uf-orange)}

/* Stat cards */
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
.stat-card{background:var(--surface);border-radius:var(--r2);padding:16px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border)}
.stat-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:4px;border-radius:4px 0 0 4px}
.stat-card.acc::before{background:var(--uf-orange)}
.stat-card.ok::before{background:var(--acc3)}
.stat-card.blue::before{background:var(--uf-blue)}
.stat-card.warn::before{background:var(--acc4)}
.stat-card.info::before{background:#4a7fd4}
.stat-card.purple::before{background:#9b59b6}
.sc-label{font-family:var(--font-m);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.sc-val{font-family:var(--font-d);font-size:32px;font-weight:800;line-height:1;margin-bottom:4px}
.sc-val.acc{color:var(--uf-orange)}.sc-val.ok{color:var(--acc3)}.sc-val.blue{color:var(--uf-blue)}.sc-val.warn{color:var(--acc4)}.sc-val.info{color:#4a7fd4}.sc-val.purple{color:#9b59b6}
.sc-sub{font-size:11px;color:var(--text2);font-weight:500}

/* Selector */
.sel-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.data-sel{background:var(--surface);color:var(--text);border:1.5px solid var(--border2);padding:8px 12px;border-radius:var(--r);font-family:var(--font-b);font-size:12px;outline:none;cursor:pointer;min-width:260px;box-shadow:var(--shadow)}
.data-sel:focus{border-color:var(--uf-orange);box-shadow:0 0 0 3px rgba(250,70,22,.1)}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse}
thead th{padding:9px 12px;text-align:left;font-family:var(--font-m);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);background:var(--surface2);border-bottom:2px solid var(--border);white-space:nowrap}
tbody td{padding:9px 12px;font-size:12px;color:var(--text);border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover td{background:var(--uf-orange-pale,#FFF0EC)}
tbody tr:last-child td{border-bottom:none}
td.mono{font-family:var(--font-m);font-size:11px}
td.ok{color:#15803D;font-weight:600}td.warn{color:#92400E;font-weight:600}td.danger{color:#B91C1C;font-weight:600}td.acc{color:var(--uf-orange);font-weight:600}

/* Pill */
.pill{font-family:var(--font-d);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
.pill.acc{background:var(--uf-orange-pale,#FFF0EC);color:var(--uf-orange);border:1px solid rgba(250,70,22,.25)}
.pill.info{background:var(--uf-blue-pale,#E8EEF8);color:var(--uf-blue);border:1px solid rgba(0,48,135,.2)}

/* Spinner */
.uf-spinner-wrap{display:flex;justify-content:center;align-items:center;min-height:200px}
.uf-spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:var(--uf-orange);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px;color:var(--text3);font-family:var(--font-m);font-size:12px}
</style>
</head>
<body>
<div class="app">

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-top">
      <div class="sidebar-logo-gator">F</div>
      <div>
        <div class="logo-text">GATORS AMS</div>
        <div class="logo-sub">Athlete Portal</div>
      </div>
    </div>
    <div class="sidebar-stripe"></div>
  </div>
  <div class="sidebar-athlete">
    <div class="sidebar-athlete-name" id="sidebar-name">Loading...</div>
    <div class="sidebar-athlete-pos" id="sidebar-pos"></div>
  </div>
  <div class="nav-user">
    <button class="btn-logout-side" id="logout-btn">Sign Out</button>
  </div>
</div>

<!-- Main -->
<div class="main-area">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-crest">UF</div>
      <div class="topbar-title">My Performance</div>
    </div>
  </div>
  <div class="content-area">

    <!-- GPS Section -->
    <div class="panel">
      <div class="panel-title"><i class="ti ti-satellite"></i>GPS — Session Data</div>
      <div class="sel-row">
        <select class="data-sel" id="session-sel" onchange="renderSession()">
          <option value="">Select a session...</option>
        </select>
      </div>
      <div class="stat-row" id="session-stats">
        <div class="empty-state" style="grid-column:1/-1">Select a session above to view your stats.</div>
      </div>
    </div>

    <!-- VALD Section -->
    <div class="panel">
      <div class="panel-title"><i class="ti ti-bolt"></i>Testing — CMJ &amp; NordBord</div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Jump Height (cm)</th>
              <th>mRSI</th>
              <th>Nord Left Force (N)</th>
              <th>Nord Right Force (N)</th>
              <th>Nord Asymmetry %</th>
            </tr>
          </thead>
          <tbody id="vald-table">
            <tr><td colspan="7" class="empty-state">Loading testing data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const SB = createClient(
  'https://fyhgvxfrwbwuqxllodip.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5aGd2eGZyd2J3dXF4bGxvZGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzk5ODIsImV4cCI6MjA5NDcxNTk4Mn0.665OZwCsBvnHCVZ-ApiF2xM1CBgTIYZe2EEbuW7IW3U'
);

// Auth check
const { data:{ session } } = await SB.auth.getSession();
if (!session) { window.location.href = './login.html'; throw 0; }

const { data: profile } = await SB.from('profiles')
  .select('full_name, role, display_name')
  .eq('id', session.user.id)
  .single();

if (!profile || profile.role !== 'athlete') {
  window.location.href = './dashboard.html';
  throw 0;
}

SB.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') window.location.href = './login.html'; });

document.getElementById('logout-btn').addEventListener('click', async () => {
  await SB.auth.signOut();
  window.location.href = './login.html';
});

const athleteName = profile.display_name || profile.full_name;
document.getElementById('sidebar-name').textContent = athleteName;

// Fetch athlete position
const { data: athleteRow } = await SB.from('athletes')
  .select('position')
  .eq('name', athleteName)
  .single();
if (athleteRow) document.getElementById('sidebar-pos').textContent = athleteRow.position;

// Fetch GPS sessions for this athlete (current year)
const { data: sessions } = await SB.from('catapult_sessions')
  .select('session_date,total_player_load,total_distance,velocity_band4_distance,velocity_band5_distance,max_velocity,accel_b2_3_efforts,decel_b2_3_efforts')
  .eq('athlete_name', athleteName)
  .gte('session_date', '01/01/2026')
  .order('session_date', { ascending: false });

// Populate session dropdown
const sel = document.getElementById('session-sel');
(sessions || []).forEach(s => {
  const o = document.createElement('option');
  o.value = s.session_date;
  o.textContent = s.session_date;
  o.dataset.json = JSON.stringify(s);
  sel.appendChild(o);
});

window.renderSession = function() {
  const sel = document.getElementById('session-sel');
  const opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.dataset.json) {
    document.getElementById('session-stats').innerHTML = '<div class="empty-state" style="grid-column:1/-1">Select a session above to view your stats.</div>';
    return;
  }
  const s = JSON.parse(opt.dataset.json);
  const hsr = (+s.velocity_band4_distance||0) + (+s.velocity_band5_distance||0);
  document.getElementById('session-stats').innerHTML = `
    <div class="stat-card acc"><div class="sc-label">Player Load</div><div class="sc-val acc">${(+s.total_player_load||0).toFixed(0)}</div><div class="sc-sub">arbitrary units</div></div>
    <div class="stat-card blue"><div class="sc-label">Total Distance</div><div class="sc-val blue">${Math.round(+s.total_distance||0).toLocaleString()}</div><div class="sc-sub">meters</div></div>
    <div class="stat-card ok"><div class="sc-label">High Speed Distance</div><div class="sc-val ok">${Math.round(hsr).toLocaleString()}</div><div class="sc-sub">meters (12+ mph)</div></div>
    <div class="stat-card info"><div class="sc-label">Max Velocity</div><div class="sc-val info">${(+s.max_velocity||0).toFixed(2)}</div><div class="sc-sub">mph</div></div>
    <div class="stat-card warn"><div class="sc-label">Accel Efforts</div><div class="sc-val warn">${+s.accel_b2_3_efforts||0}</div><div class="sc-sub">efforts</div></div>
    <div class="stat-card purple"><div class="sc-label">Decel Efforts</div><div class="sc-val purple">${+s.decel_b2_3_efforts||0}</div><div class="sc-sub">efforts</div></div>
  `;
};

// Auto-select most recent session
if (sel.options.length > 1) {
  sel.selectedIndex = 1;
  renderSession();
}

// Fetch VALD data
const [{ data: cmj }, { data: nord }] = await Promise.all([
  SB.from('cmj_tests')
    .select('test_date,jump_height_cm,rsi_modified')
    .eq('athlete_name', athleteName)
    .gte('test_date', '2026-01-01')
    .order('test_date', { ascending: false }),
  SB.from('nordbord_tests')
    .select('test_date,left_peak_force_n,right_peak_force_n,lsi_pct')
    .eq('athlete_name', athleteName)
    .gte('test_date', '2026-01-01')
    .order('test_date', { ascending: false }),
]);

// Combine and sort
const valdRows = [
  ...(cmj||[]).map(r => ({ date: r.test_date, type: 'CMJ', jh: r.jump_height_cm, rsi: r.rsi_modified, lf: null, rf: null, asym: null })),
  ...(nord||[]).map(r => {
    const lf = r.left_peak_force_n, rf = r.right_peak_force_n;
    const asym = lf && rf && Math.max(lf,rf) > 0 ? (1 - Math.min(lf,rf)/Math.max(lf,rf))*100 : null;
    return { date: r.test_date, type: 'NordBord', jh: null, rsi: null, lf, rf, asym };
  }),
].sort((a,b) => b.date.localeCompare(a.date));

document.getElementById('vald-table').innerHTML = valdRows.length
  ? valdRows.map(r => {
      const asymCls = r.asym == null ? '' : r.asym < 10 ? 'ok' : r.asym < 20 ? 'warn' : 'danger';
      return `<tr>
        <td class="mono">${r.date}</td>
        <td><span class="pill ${r.type==='CMJ'?'acc':'info'}">${r.type}</span></td>
        <td class="mono ${r.jh ? 'acc' : ''}">${r.jh != null ? r.jh.toFixed(1) : '—'}</td>
        <td class="mono">${r.rsi != null ? r.rsi.toFixed(2) : '—'}</td>
        <td class="mono">${r.lf != null ? r.lf.toFixed(1) : '—'}</td>
        <td class="mono">${r.rf != null ? r.rf.toFixed(1) : '—'}</td>
        <td class="mono ${asymCls}">${r.asym != null ? r.asym.toFixed(1)+'%' : '—'}</td>
      </tr>`;
    }).join('')
  : '<tr><td colspan="7" class="empty-state">No testing data found for this year.</td></tr>';
</script>
</body>
</html>

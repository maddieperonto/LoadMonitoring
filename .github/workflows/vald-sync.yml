name: VALD Nightly Sync

# Two schedules, both in UTC (GitHub Actions cron has no timezone support):
#   - '0 6 * * *'  — nightly catch-all, every day, ~1-2am Eastern.
#   - '0 19 * * 1' — Monday-only, 19:00 UTC (3pm EDT / 2pm EST), after CMJ testing wraps.
# Can also be fired on demand via Actions tab → VALD Nightly Sync → Run workflow.
# Optional "from_date" (YYYY-MM-DD) on a manual run re-pulls VALD history from that date
# (e.g. 2025-01-01) instead of only "since the last synced test". Safe to repeat — rows
# upsert on VALD test id. Leave it blank for a normal sync; scheduled runs never set it.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 19 * * 1'
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Backfill from this date (YYYY-MM-DD), e.g. 2025-01-01. Leave blank for normal sync.'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  vald-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Install packages and run VALD sync
        env:
          VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
          VALD_CLIENT_PASSWORD: ${{ secrets.VALD_CLIENT_PASSWORD }}
          VALD_DUENDE_ID: ${{ secrets.VALD_DUENDE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VALD_FROM_DATE: ${{ github.event.inputs.from_date }}
        run: |
          Rscript -e "install.packages(c('httr2','jsonlite','dplyr','lubridate','stringr'), repos='https://packagemanager.posit.co/cran/__linux__/noble/latest')"
          Rscript scripts/vald_sync.R

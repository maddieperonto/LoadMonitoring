name: VALD Nightly Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  vald-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: Install R packages
        run: Rscript -e "install.packages(c('httr2','jsonlite','dplyr','lubridate','stringr'), repos='https://cloud.r-project.org')"
      - name: Run VALD sync
        env:
          VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
          VALD_CLIENT_PASSWORD: ${{ secrets.VALD_CLIENT_PASSWORD }}
          VALD_DUENDE_ID: ${{ secrets.VALD_DUENDE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: Rscript scripts/vald_sync.R

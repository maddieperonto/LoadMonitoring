name: Catapult Athlete Profiles Sync

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Install packages and run sync
        env:
          CATAPULT_BASE_URL: ${{ secrets.CATAPULT_BASE_URL }}
          CATAPULT_API_TOKEN: ${{ secrets.CATAPULT_API_TOEKN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          Rscript -e "install.packages(c('httr2','jsonlite','dplyr','stringr'), repos='https://packagemanager.posit.co/cran/__linux__/noble/latest')"
          Rscript scripts/catapult_athlete_profiles_sync.R
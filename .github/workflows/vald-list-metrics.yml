name: VALD List Metrics (one-off)

on:
  workflow_dispatch:

jobs:
  list-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - name: Install packages and list metrics
        env:
          VALD_CLIENT_ID: ${{ secrets.VALD_CLIENT_ID }}
          VALD_CLIENT_PASSWORD: ${{ secrets.VALD_CLIENT_PASSWORD }}
        run: |
          Rscript -e "install.packages(c('httr2','jsonlite'), repos='https://packagemanager.posit.co/cran/__linux__/noble/latest')"
          Rscript scripts/vald_list_metrics.R